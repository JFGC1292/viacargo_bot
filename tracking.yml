name: Seguimiento Via Cargo

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Evitar paquetes recomendados de apt
        # Sin esto, "playwright install --with-deps" también baja fuentes
        # para japonés, tailandés, chino, cirílico, etc. que no usamos.
        run: echo 'APT::Install-Recommends "false";' | sudo tee /etc/apt/apt.conf.d/99-no-recommends

      - name: Instalar librerías de Python
        run: pip install -r requirements.txt

      - name: Cachear navegador Chromium de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Instalar Chromium + dependencias del sistema
        run: playwright install --with-deps chromium

      - name: Revisar guías pendientes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_tracking.py

      - name: Guardar cambios en guias.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guias.json
          git commit -m "Actualizar guías pendientes [skip ci]" || echo "Sin cambios para commitear"
          git push
